apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:sales:orders
name: orders
version: 1.0.0
status: active
domain: sales
dataProduct: orders

description:
  purpose: >
    Замовлення інтернет-магазину, що надходять від сервісу продажів
    у хмарне озеро даних для аналітики та звітності.
  usage: Щоденна звітність з виручки, аналіз клієнтської поведінки.
  limitations: Суми зберігаються в основних одиницях валюти (гривні, долари, євро), не в копійках.

team:
  - username: sales-backend-team
    role: owner
  - username: data-platform-team
    role: consumer

schema:
  - name: orders
    physicalName: orders
    physicalType: table
    logicalType: object
    description: Одне замовлення — один рядок.
    quality:
      - rule: rowCount
        mustBeGreaterThan: 0
        description: Файл не може бути порожнім.
    properties:
      - name: order_id
        logicalType: string
        required: true
        unique: true
        primaryKey: true
        logicalTypeOptions:
          pattern: "^ORD-[0-9]{6}$"
        description: Унікальний ідентифікатор замовлення.

      - name: customer_id
        logicalType: string
        required: true
        logicalTypeOptions:
          pattern: "^C[0-9]{5}$"
        description: Ідентифікатор клієнта.

      - name: order_date
        logicalType: date
        required: true
        logicalTypeOptions:
          format: "yyyy-MM-dd"
        description: Дата замовлення у форматі ISO 8601.

      - name: amount
        logicalType: number
        required: true
        logicalTypeOptions:
          minimum: 0
          maximum: 100000
        description: Сума замовлення в основних одиницях валюти.

      - name: currency
        logicalType: string
        required: true
        quality:
          - rule: validValues
            validValues: [UAH, USD, EUR]
        description: Код валюти ISO 4217.

      - name: status
        logicalType: string
        required: true
        quality:
          - rule: validValues
            validValues: [new, paid, shipped, cancelled]
        description: Статус замовлення.

slaProperties:
  - property: frequency
    value: 1
    unit: d
  - property: latency
    value: 1
    unit: h
